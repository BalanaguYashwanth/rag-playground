[project]
name = "rag-playground"
version = "0.1.0"
description = "Playground to play with rag using langchain"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "python-multipart>=0.0.20",
    "pypdf>=6.0.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-unstructured>=1.0.1",
    "sentence-transformers>=6.1.0",
    "torch<2.10",
    "unstructured>=0.27.10",
    "uvicorn>=0.54.0",
    "fastapi-guard>=8.0.2,<9",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
